<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ComicCraft - AI Comic Creator</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

<div class="container">

    <div class="hero">

        <h1>🎨 ComicCraft</h1>

        <p>
            Create your own AI-powered comic story
            in seconds.
        </p>

    </div>


    <div class="card">

        <form
            action="/generate"
            method="post"
        >

            <label>
                Story Prompt
            </label>

            <textarea
                name="story_prompt"
                placeholder="Example: A brave fox exploring an enchanted forest"
                required
            ></textarea>


            <label>
                Main Character Name
            </label>

            <input
                type="text"
                name="character_name"
                placeholder="Example: Leo"
                required
            >


            <label>
                Setting
            </label>

            <select
                name="setting"
                required
            >

                <option value="enchanted forest">
                    Enchanted Forest
                </option>

                <option value="school">
                    School
                </option>

                <option value="space">
                    Space
                </option>

                <option value="city">
                    City
                </option>

                <option value="underwater world">
                    Underwater World
                </option>

            </select>


            <label>
                Story Tone
            </label>

            <select
                name="tone"
                required
            >

                <option value="light-hearted">
                    Light-hearted
                </option>

                <option value="funny">
                    Funny
                </option>

                <option value="dramatic">
                    Dramatic
                </option>

                <option value="poetic">
                    Poetic
                </option>

            </select>


            <label>
                Art Style
            </label>

            <select
                name="art_style"
                required
            >

                <option value="comic book">
                    Comic Book
                </option>

                <option value="anime">
                    Anime
                </option>

                <option value="pixel art">
                    Pixel Art
                </option>

                <option value="realistic">
                    Realistic
                </option>

            </select>


            <button type="submit">
                ✨ Generate Comic
            </button>

        </form>

    </div>

</div>

</body>

</html>
